
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>CȘE Admin – Autentificare</title> 

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #244D68;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      text-align: center;
    }

    h1 {
      color: #244D68;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #377C36;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2b632a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>CȘE Admin</h1>

    <p class="subtitle">
      Liceul Teoretic „Lucian Blaga” Reghin
    </p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Adresa de email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Parola"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Conectare
      </button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ilrcoxzqqvmjhlufytsd.supabase.co";
    const SUPABASE_KEY = "Ssb_publishable_cHVoHM2bX2RP0G64Embhyw_gHIDmy2F";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Se verifică autentificarea...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const { error: loginError } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (loginError) {
          message.textContent =
            "Autentificarea nu a reușit.";
          return;
        }

        const { data, error: roleError } =
          await supabase.rpc("cse_dashboard_role");

        if (roleError) {
          await supabase.auth.signOut();
          message.textContent =
            "Nu s-au putut verifica permisiunile.";
          return;
        }

        if (
          data !== "super_admin" &&
          data !== "admin"
        ) {
          await supabase.auth.signOut();
          message.textContent =
            "Acest cont nu are acces administrativ.";
          return;
        }

        message.style.color = "#377C36";
        message.textContent =
          "Autentificare reușită!";

        // Vom adăuga redirecționarea
        // după ce construim dashboardul.

      } catch (error) {
        message.textContent =
          "A apărut o eroare de conexiune.";
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
