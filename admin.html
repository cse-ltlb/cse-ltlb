
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CȘE Blaga | Administrare</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f7fc;
      color: #102C50;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(16,44,80,.08);
    }

    .logo {
      background: linear-gradient(120deg,#2677EF,#19A875);
      color: white;
      width: 55px;
      height: 55px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd7e6;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2677EF;
      border-color: #2677EF;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #2677EF;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #155fc9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.5;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #a32323;
    }

    .success {
      display: block;
      background: #e7f8ef;
      color: #12663e;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <div class="logo">CȘE</div>

    <h1>Panou de administrare</h1>

    <p class="description">
      Autentifică-te pentru a administra întrebările
      și activitatea Consiliului Școlar al Elevilor.
    </p>

    <form id="loginForm">

      <label for="email">Adresa de e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="E-mail"
        autocomplete="username"
        required
      >

      <label for="password">Parola</label>
      <input
        type="password"
        id="password"
        placeholder="Parola"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Autentificare
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="footer">
      Consiliul Școlar al Elevilor · Liceul Teoretic „Lucian Blaga”
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://ilrcoxzqqvmjhlufytsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cHVoHM2bX2RP0G64Embhyw_gHIDmy2F";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "Se verifică...";

      message.className = "message";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", data.user.id)
            .single();

        if (profileError) throw profileError;

        if (!["president", "vice_president"].includes(profile.role)) {
          await supabaseClient.auth.signOut();
          throw new Error("Nu ai permisiunea de administrator.");
        }

        showMessage(
          "Autentificare reușită! Administrator verificat.",
          "success"
        );

      } catch (error) {
        showMessage(error.message || "A apărut o eroare.", "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Autentificare";
      }
    });
  </script>

</body>
</html>
